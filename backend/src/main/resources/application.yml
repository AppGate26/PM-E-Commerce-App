spring:
  jpa:
    hibernate:
      # Flyway now owns the schema (see spring.flyway below) - validate checks the
      # live schema matches these entity mappings on startup instead of silently
      # auto-altering it. IMPORTANT: this only works once docs/flyway_baseline_bootstrap.sql
      # has been run by hand against this database - without that, Flyway sees no
      # history at all and tries to replay V1 through V999 for real, which will fail
      # outright on V4 (DROP COLUMN products.branch_id - already gone).
      ddl-auto: validate
    show-sql: 'false'
    # database-platform: org.hibernate.dialect.MySQLDialect
    # Custom dialect (com.appGate.config.VarcharEnumMariaDBDialect) instead of the stock
    # MariaDBDialect: Hibernate 6 defaults @Enumerated(EnumType.STRING) columns to a
    # native SQL ENUM type on MySQL/MariaDB, but every enum column in this schema was
    # created years ago (under ddl-auto=update, which never checked this) as plain
    # VARCHAR, which is what's actually correct here. The documented global property for
    # this (hibernate.type.preferred_enum_jdbc_type) only affects DDL generation, not
    # schema validation, in this Hibernate version - it had no effect on the
    # ddl-auto=validate failure this dialect override fixes.
    database-platform: com.appGate.config.VarcharEnumMariaDBDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # No baseline-on-migrate here - docs/flyway_baseline_bootstrap.sql already creates
    # flyway_schema_history and inserts the baseline row by hand (recommended baseline
    # version 1000.1, since the V1000/V1000.1 sample-ledger-data files never actually
    # ran and shouldn't fire automatically the first time this boots with Flyway on).
