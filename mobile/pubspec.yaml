name: pm_e_commerce_app
description: "Pm E-Commerce Mobile Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^12.1.3
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  google_maps_flutter: ^2.10.0
  geocoding: ^3.0.0
  geolocator: ^10.1.0
  intl: ^0.19.0
  image_picker: ^1.0.7
  permission_handler: ^11.0.0
  flutter_riverpod: ^3.0.3
  dio: ^5.5.0
  webview_flutter: ^4.9.0
  url_launcher: ^6.2.5
  shimmer: ^3.0.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/images/phones/
    - assets/images/laptops/
    - assets/images/shoes/
    - assets/images/bags/
    - assets/images/watches/
    - assets/images/gadgets/
    - assets/images/accessories/
    - assets/images/speakers/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/Playfair-VariableFont_opsz,wdth,wght.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
