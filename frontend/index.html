<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        function isExtensionAccessNoise(reason) {
          return (
            reason &&
            typeof reason === "object" &&
            reason.httpError === false &&
            Number(reason.code) === 403 &&
            (Number(reason.httpStatus) === 200 ||
              reason.httpStatus === "" ||
              reason.httpStatus === undefined ||
              reason.name === "n")
          );
        }

        function silenceKnownExtensionPromise(event) {
          if (isExtensionAccessNoise(event && event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
          return undefined;
        }

        window.addEventListener(
          "unhandledrejection",
          silenceKnownExtensionPromise,
          true
        );
        window.onunhandledrejection = silenceKnownExtensionPromise;
      })();
    </script>
